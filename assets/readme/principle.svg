<svg viewBox="0 0 680 450" width="100%" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>make-sfx 构建期与运行期原理</title>
  <desc>构建期用 7z.exe CLI 压缩并拼接成单文件 exe；运行期由 7zSD.sfx 桩自带解码器解压并执行，目标机不需要 7z.exe。</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
  </defs>

  <text x="340" y="30" text-anchor="middle" font-size="14" font-weight="500" fill="#1F2937">make-sfx 原理：构建期 vs 运行期</text>

  <text x="175" y="62" text-anchor="middle" font-size="13" font-weight="500" fill="#185FA5">构建期 · 调用 7z.exe CLI</text>
  <text x="505" y="62" text-anchor="middle" font-size="13" font-weight="500" fill="#0F6E56">运行期 · 不依赖 7z.exe</text>

  <g>
    <rect x="50" y="80" width="250" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text x="175" y="100" text-anchor="middle" font-size="13" fill="#042C53">源文件夹 + 安装脚本</text>
    <text x="175" y="118" text-anchor="middle" font-size="12" fill="#0C447C">install.cmd / wizard.ps1 …</text>
  </g>
  <line x1="175" y1="136" x2="175" y2="160" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="50" y="160" width="250" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text x="175" y="180" text-anchor="middle" font-size="13" fill="#042C53">7z.exe 压缩</text>
    <text x="175" y="198" text-anchor="middle" font-size="12" fill="#0C447C">7z a -t7z -m0=lzma2 …</text>
  </g>
  <line x1="175" y1="216" x2="175" y2="240" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="50" y="240" width="250" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text x="175" y="260" text-anchor="middle" font-size="13" fill="#042C53">图标盖章</text>
    <text x="175" y="278" text-anchor="middle" font-size="12" fill="#0C447C">UpdateResource (Win32 API)</text>
  </g>
  <line x1="175" y1="296" x2="175" y2="320" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="50" y="320" width="250" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text x="175" y="340" text-anchor="middle" font-size="13" fill="#042C53">拼接成单文件 .exe</text>
    <text x="175" y="358" text-anchor="middle" font-size="12" fill="#0C447C">stub + config + payload</text>
  </g>

  <g>
    <rect x="380" y="80" width="250" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
    <text x="505" y="100" text-anchor="middle" font-size="13" fill="#04342C">双击 .exe</text>
    <text x="505" y="118" text-anchor="middle" font-size="12" fill="#085041">用户运行</text>
  </g>
  <line x1="505" y1="136" x2="505" y2="160" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="380" y="160" width="250" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
    <text x="505" y="180" text-anchor="middle" font-size="13" fill="#04342C">7zSD.sfx 桩解压</text>
    <text x="505" y="198" text-anchor="middle" font-size="12" fill="#085041">内置 LZMA 解码 → %TEMP%</text>
  </g>
  <line x1="505" y1="216" x2="505" y2="240" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="380" y="240" width="250" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
    <text x="505" y="260" text-anchor="middle" font-size="13" fill="#04342C">读 config.txt</text>
    <text x="505" y="278" text-anchor="middle" font-size="12" fill="#085041">执行 ExecuteFile (launcher.exe)</text>
  </g>
  <line x1="505" y1="296" x2="505" y2="320" stroke="#5F5E5A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="380" y="320" width="250" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
    <text x="505" y="340" text-anchor="middle" font-size="13" fill="#04342C">退出后删 %TEMP%</text>
    <text x="505" y="358" text-anchor="middle" font-size="12" fill="#085041">安装完成</text>
  </g>

  <path d="M175 376 C 175 420, 505 420, 505 376" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="340" y="412" text-anchor="middle" font-size="12" fill="#444441">成品 .exe 交付</text>

  <text x="340" y="438" text-anchor="middle" font-size="12" fill="#444441">7z.exe 只在构建期出现一次；运行期由 7zSD.sfx 桩自带解码器完成解压</text>
</svg>
